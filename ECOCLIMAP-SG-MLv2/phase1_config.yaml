xp_name: iteration5
seed: 666
cuda: true
paths:
    data_dir: /path/to/data/directory/
    experiments_dir: /path/to/experiments/directory/
versions:
    ecosgplus: 2.0
    ecosgml: 0.6
dimensions:
    n_channels_hiddenlay: 32
    n_channels_embedding: 50
    n_px_embedding: 600
dataloader:
    type: LandcoverToLandcoverDataLoader
    params:
        datasets: ["esawc.hdf5", "esgp.hdf5", "ecosg.hdf5", "oso.hdf5", "clc.hdf5"]
        num_workers: 0
        pos_enc: true
training:
    batch_size: 16
    n_epochs: 120
    tensorboard: false
    validate_every: 1
    print_inc: 10
agent:
    type: MultiLULCAgent
    params: {}
model:
    type: universal_embedding
    name: UnivEmb
    use_pos: sinusoidal
    pos_enc_dim: 10
    params:
        memory_monger: false
        up_mode: bilinear
        decoder_depth: 1
        mode: light
        pooling_factors: [3,3,3,3,3]
        mul: false
        softpos: true
        decoder_atrou: true
optimizer:
    type: Adam
    params:
        lr: 0.0016